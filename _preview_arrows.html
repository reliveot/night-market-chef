<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "Noto Sans TC", "PingFang TC", sans-serif;
    background: #1a110b;
    color: #fffbeb;
    padding: 20px;
    width: 820px;
  }
  h1 { font-size: 20px; color: #fde68a; margin-bottom: 4px; }
  p.sub { font-size: 13px; color: #cbd5e1; margin-bottom: 16px; }
  .grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 14px;
  }
  .card {
    background: linear-gradient(155deg, rgba(60, 28, 12, 0.9), rgba(28, 14, 8, 0.95));
    border: 1.5px solid rgba(251, 191, 36, 0.35);
    border-radius: 18px;
    padding: 14px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
  }
  .card-title { font-size: 14px; font-weight: 800; color: #fde68a; }
  .card-desc { font-size: 12px; color: #cbd5e1; text-align: center; }
  .stage {
    position: relative;
    width: 220px;
    height: 220px;
    display: grid;
    place-items: center;
    background: radial-gradient(circle, rgba(255,255,255,0.06), transparent 70%);
    border-radius: 50%;
  }
  .food-bg {
    width: 170px;
    height: 170px;
    object-fit: contain;
    opacity: 0.9;
    filter: drop-shadow(0 8px 16px rgba(0,0,0,0.5));
  }
  .arrow-layer {
    position: absolute;
    inset: 0;
    display: grid;
    place-items: center;
  }
  .arrow-svg {
    width: 196px;
    height: 196px;
    overflow: visible;
  }
  .glow-gold { filter: drop-shadow(0 0 8px rgba(251, 191, 36, 0.85)) drop-shadow(0 2px 4px rgba(0,0,0,0.8)); }
  .glow-cyan { filter: drop-shadow(0 0 8px rgba(56, 189, 248, 0.9)) drop-shadow(0 2px 4px rgba(0,0,0,0.8)); }
</style>
</head>
<body>
  <h1>🏮 夜市霓虹燈管風格箭頭 — 設計預覽</h1>
  <p class="sub">修長箭身＋小巧尖銳箭頭＋尾羽缺口＋半透明霓虹發光，兩支同時置中交叉也不會互相遮住方向</p>

  <svg width="0" height="0" style="position:absolute;">
    <defs>
      <linearGradient id="nmGold" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.72" />
        <stop offset="55%" stop-color="#FBBF24" stop-opacity="0.92" />
        <stop offset="100%" stop-color="#FEF08A" stop-opacity="0.98" />
      </linearGradient>
      <linearGradient id="nmCyan" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%" stop-color="#0284C7" stop-opacity="0.72" />
        <stop offset="55%" stop-color="#38BDF8" stop-opacity="0.92" />
        <stop offset="100%" stop-color="#BAE6FD" stop-opacity="0.98" />
      </linearGradient>
      <!-- Sleek Night Market Arrow Path: notched lantern-tassel tail, slender shaft, compact crisp arrowhead -->
      <path id="nmArrowShape" d="M16 55.5 L86 55.5 L77 45.5 L81.5 41.5 L108 60 L81.5 78.5 L77 74.5 L86 64.5 L16 64.5 L23 60 Z" />
    </defs>
  </svg>

  <div class="grid">
    <!-- 1. 單支金黃（正方向） -->
    <div class="card">
      <div class="card-title">① 單支：夜市暖金（照箭頭揮）</div>
      <div class="stage">
        <img class="food-bg" src="assets/ingredients/chicken_cutlet.webp" />
        <div class="arrow-layer">
          <svg class="arrow-svg glow-gold" viewBox="0 0 120 120" style="transform: rotate(0deg);">
            <use href="#nmArrowShape" fill="url(#nmGold)" stroke="#451A03" stroke-width="3.2" stroke-linejoin="round" />
            <use href="#nmArrowShape" fill="none" stroke="#FFFBEB" stroke-width="1.2" stroke-linejoin="round" />
          </svg>
        </div>
      </div>
      <div class="card-desc">尾羽缺口＋細身＋小巧尖銳箭頭，食材清楚不被蓋滿</div>
    </div>

    <!-- 2. 單支青藍（反方向） -->
    <div class="card">
      <div class="card-title">② 單支：霓虹青藍（反方向揮）</div>
      <div class="stage">
        <img class="food-bg" src="assets/ingredients/chicken_cutlet.webp" />
        <div class="arrow-layer">
          <svg class="arrow-svg glow-cyan" viewBox="0 0 120 120" style="transform: rotate(-135deg);">
            <use href="#nmArrowShape" fill="url(#nmCyan)" stroke="#082F49" stroke-width="3.2" stroke-linejoin="round" />
            <use href="#nmArrowShape" fill="none" stroke="#E0F2FE" stroke-width="1.2" stroke-linejoin="round" />
          </svg>
        </div>
      </div>
      <div class="card-desc">高對比霓虹青藍，深色外框＋微白內光邊</div>
    </div>

    <!-- 3. 雙刀置中交叉（90° / 135°） -->
    <div class="card">
      <div class="card-title">③ 雙刀同時置中（交叉：金黃 + 青藍）</div>
      <div class="stage">
        <img class="food-bg" src="assets/ingredients/chicken_cutlet.webp" />
        <div class="arrow-layer">
          <svg class="arrow-svg glow-gold" viewBox="0 0 120 120" style="transform: rotate(0deg);">
            <use href="#nmArrowShape" fill="url(#nmGold)" stroke="#451A03" stroke-width="3.2" stroke-linejoin="round" />
            <use href="#nmArrowShape" fill="none" stroke="#FFFBEB" stroke-width="1.2" stroke-linejoin="round" />
          </svg>
        </div>
        <div class="arrow-layer">
          <svg class="arrow-svg glow-cyan" viewBox="0 0 120 120" style="transform: rotate(-135deg);">
            <use href="#nmArrowShape" fill="url(#nmCyan)" stroke="#082F49" stroke-width="3.2" stroke-linejoin="round" />
            <use href="#nmArrowShape" fill="none" stroke="#E0F2FE" stroke-width="1.2" stroke-linejoin="round" />
          </svg>
        </div>
      </div>
      <div class="card-desc">兩支都正中央！只有細軸交叉，兩個箭頭尖端都超明確</div>
    </div>

    <!-- 4. 雙刀置中近角（45° 測試） -->
    <div class="card">
      <div class="card-title">④ 極限測試：相鄰 45° 同時置中</div>
      <div class="stage">
        <img class="food-bg" src="assets/ingredients/chicken_cutlet.webp" />
        <div class="arrow-layer">
          <svg class="arrow-svg glow-gold" viewBox="0 0 120 120" style="transform: rotate(-90deg);">
            <use href="#nmArrowShape" fill="url(#nmGold)" stroke="#451A03" stroke-width="3.2" stroke-linejoin="round" />
            <use href="#nmArrowShape" fill="none" stroke="#FFFBEB" stroke-width="1.2" stroke-linejoin="round" />
          </svg>
        </div>
        <div class="arrow-layer">
          <svg class="arrow-svg glow-cyan" viewBox="0 0 120 120" style="transform: rotate(-45deg);">
            <use href="#nmArrowShape" fill="url(#nmCyan)" stroke="#082F49" stroke-width="3.2" stroke-linejoin="round" />
            <use href="#nmArrowShape" fill="none" stroke="#E0F2FE" stroke-width="1.2" stroke-linejoin="round" />
          </svg>
        </div>
      </div>
      <div class="card-desc">就算只差 45°（↑ 與 ↗），前端小巧依然完全分得出來！</div>
    </div>
  </div>
</body>
</html>
